services:
  bill-ledger:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - bill-data:/data
      - bill-originals:/data/originals
      - bill-whatsapp-auth:/data/whatsapp-auth
      - ./secrets:/run/secrets:ro
    environment:
      APP_HOST: 0.0.0.0
      APP_DATA_DIR: /data
      APP_DATABASE_PATH: /data/bill-ledger.sqlite
      WHATSAPP_ORIGINALS_DIR: /data/originals
      WHATSAPP_AUTH_PATH: /data/whatsapp-auth
      GOOGLE_SERVICE_ACCOUNT_JSON: /run/secrets/google-service-account.json
      GOOGLE_OAUTH_CREDENTIAL_JSON: /run/secrets/google-authorized-user.json
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  bill-data:
  bill-originals:
  bill-whatsapp-auth:
