services:
  bill-ledger:
    environment:
      REVIEW_ORIGIN: ${REVIEW_ORIGIN:?Set a distinct HTTPS customer hostname in REVIEW_ORIGIN}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:?Set GOOGLE_ENABLED in the customer env file}
      GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:?Set GOOGLE_AUTH_MODE in the customer env file}
    networks:
      default:
      monitoring:
        aliases:
          - ${CUSTOMER_ID:?Set CUSTOMER_ID in the customer env file}
networks:
  monitoring:
    external: true
    name: bill-monitoring
